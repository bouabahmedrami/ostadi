<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0118"/>
      <stop offset="100%" style="stop-color:#110225"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500"/>
      <stop offset="100%" style="stop-color:#FF4500"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF7FFF"/>
      <stop offset="100%" style="stop-color:#8B3FED"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#D8B4FE"/>
    </linearGradient>

    <!-- Neon glow filters -->
    <filter id="neonPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonWhite" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2D0A5E;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0D0118;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="20%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#4C1D95;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0D0118;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="20" fill="url(#bgGrad)"/>

  <!-- Background ambient glow -->
  <ellipse cx="115" cy="100" rx="130" ry="100" fill="url(#bgGlow)"/>
  <ellipse cx="420" cy="40" rx="100" ry="80" fill="#FF6B00" opacity="0.04"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.12" stroke="#A855F7" stroke-width="0.5">
    <line x1="0" y1="40" x2="230" y2="40"/>
    <line x1="0" y1="80" x2="230" y2="80"/>
    <line x1="0" y1="120" x2="230" y2="120"/>
    <line x1="0" y1="160" x2="230" y2="160"/>
    <line x1="40" y1="0" x2="40" y2="200"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
  </g>

  <!-- Icon area background glow -->
  <circle cx="112" cy="100" r="80" fill="url(#iconBg)"/>

  <!-- ── ICON: Neon Graduation Cap inside circles ── -->

  <!-- Outer neon ring - purple -->
  <circle cx="112" cy="100" r="72" fill="none" stroke="#A855F7" stroke-width="1.8"
          filter="url(#neonPurple)" opacity="0.9"/>

  <!-- Middle ring - orange -->
  <circle cx="112" cy="100" r="56" fill="none" stroke="#FF8C00" stroke-width="1.2"
          filter="url(#neonOrange)" opacity="0.75"/>

  <!-- Inner ring - white subtle -->
  <circle cx="112" cy="100" r="40" fill="none" stroke="white" stroke-width="0.8" opacity="0.15"/>

  <!-- Crosshair lines at ring edges -->
  <line x1="112" y1="20" x2="112" y2="35" stroke="#A855F7" stroke-width="1.5"
        stroke-linecap="round" filter="url(#neonPurple)" opacity="0.8"/>
  <line x1="112" y1="165" x2="112" y2="180" stroke="#A855F7" stroke-width="1.5"
        stroke-linecap="round" filter="url(#neonPurple)" opacity="0.8"/>
  <line x1="32" y1="100" x2="47" y2="100" stroke="#A855F7" stroke-width="1.5"
        stroke-linecap="round" filter="url(#neonPurple)" opacity="0.8"/>
  <line x1="177" y1="100" x2="192" y2="100" stroke="#A855F7" stroke-width="1.5"
        stroke-linecap="round" filter="url(#neonPurple)" opacity="0.8"/>

  <!-- Graduation cap - neon white -->
  <!-- Cap board diamond shape -->
  <polygon points="112,68 148,84 112,100 76,84"
           fill="#A855F7" opacity="0.2"/>
  <polygon points="112,68 148,84 112,100 76,84"
           fill="none" stroke="white" stroke-width="2"
           filter="url(#neonWhite)" opacity="0.95"/>

  <!-- Cap shine top highlight -->
  <polygon points="112,68 148,84 130,76"
           fill="white" opacity="0.08"/>

  <!-- Cap cylinder / base -->
  <rect x="99" y="97" width="26" height="11" rx="4"
        fill="none" stroke="white" stroke-width="1.8"
        filter="url(#neonWhite)" opacity="0.85"/>

  <!-- Tassel string -->
  <line x1="148" y1="84" x2="148" y2="108"
        stroke="#FF8C00" stroke-width="2.2"
        stroke-linecap="round" filter="url(#neonOrange)" opacity="0.9"/>

  <!-- Tassel ball - orange neon -->
  <circle cx="148" cy="113" r="6"
          fill="#FF8C00" filter="url(#neonOrange)"/>
  <circle cx="148" cy="113" r="3" fill="white" opacity="0.5"/>

  <!-- Small decorative neon dots on outer ring -->
  <circle cx="112" cy="28" r="3.5" fill="#A855F7" filter="url(#neonPurple)"/>
  <circle cx="184" cy="100" r="3.5" fill="#FF8C00" filter="url(#neonOrange)"/>
  <circle cx="112" cy="172" r="3.5" fill="#A855F7" filter="url(#neonPurple)"/>
  <circle cx="40" cy="100" r="3.5" fill="#FF8C00" filter="url(#neonOrange)"/>

  <!-- Floating star particles -->
  <circle cx="55" cy="42" r="1.8" fill="#FFD700" filter="url(#subtleGlow)" opacity="0.9"/>
  <circle cx="168" cy="55" r="1.4" fill="white" opacity="0.5"/>
  <circle cx="48" cy="152" r="1.6" fill="#BF7FFF" filter="url(#subtleGlow)" opacity="0.8"/>
  <circle cx="172" cy="148" r="1.4" fill="#FF8C00" filter="url(#subtleGlow)" opacity="0.7"/>
  <circle cx="78" cy="30" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="150" cy="170" r="1.5" fill="#BF7FFF" opacity="0.6"/>

  <!-- ── TEXT BLOCK ── -->

  <!-- Main wordmark -->
  <text x="220" y="118"
        font-family="Inter,'Helvetica Neue',Arial,sans-serif"
        font-size="74" font-weight="900" letter-spacing="-3"
        fill="url(#textGrad)" filter="url(#textGlow)">Ostadi</text>

  <!-- Arabic text - neon orange -->
  <text x="223" y="148"
        font-family="'Noto Sans Arabic',Arial,sans-serif"
        font-size="18" font-weight="700"
        fill="#FF8C00" filter="url(#subtleGlow)" opacity="0.95">أستاذي</text>

  <!-- Dot separator -->
  <circle cx="308" cy="141" r="2.5" fill="#A855F7" opacity="0.6"/>

  <!-- Tagline -->
  <text x="318" y="150"
        font-family="Inter,sans-serif"
        font-size="11" font-weight="600" letter-spacing="3"
        fill="white" opacity="0.28">COURS EN LIGNE · DZ</text>

  <!-- Neon underline -->
  <rect x="222" y="158" width="68" height="2.5" rx="1.5"
        fill="#FF8C00" filter="url(#neonOrange)" opacity="0.9"/>
  <rect x="296" y="158" width="180" height="2.5" rx="1.5"
        fill="#A855F7" filter="url(#neonPurple)" opacity="0.5"/>

  <!-- Pulse dots row -->
  <circle cx="224" cy="172" r="3" fill="#A855F7" filter="url(#subtleGlow)"/>
  <circle cx="236" cy="172" r="3" fill="#FF8C00" filter="url(#subtleGlow)"/>
  <circle cx="248" cy="172" r="2" fill="white" opacity="0.3"/>
</svg>
